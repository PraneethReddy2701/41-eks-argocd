apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roboshop
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/PraneethReddy2701/41-eks-argocd.git
    targetRevision: main
    path: roboshop
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: 
    - CreateNamespace=true

